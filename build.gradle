buildscript {
	repositories {
		mavenCentral()
		maven { url = "https://repo1.maven.org/maven2/" }
	}
	dependencies {
		classpath 'org.ow2.asm:asm:9.7.1'
	}
}

plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven { url = "https://repo1.maven.org/maven2/" }
	maven { url = "https://maven.fabricmc.net/" }
	maven { url "https://maven.terraformersmc.com/releases" }
	maven { url 'https://maven.wispforest.io/releases/' }
	maven { url 'https://maven.ladysnake.org/releases' }
}

loom {
	accessWidenerPath = file("src/main/resources/cranks-dungeons.accesswidener")
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modCompileOnly("com.terraformersmc:modmenu:9.0.0") {
		transitive = false
	}

	// Passive Skill Tree & Config
	modImplementation "io.wispforest:owo-lib:${project.owo_version}"
	annotationProcessor "io.wispforest:owo-lib:${project.owo_version}"
	modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cardinal_components_version}"
	modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cardinal_components_version}"
	
	modCompileOnly files("libs/punchy-3.2b.jar")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

tasks.register("regressionTest", JavaExec) {
	group = "verification"
	description = "Runs dependency-free regression checks for core state transitions"
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.cranks.dungeons.RegressionTestSuite"
}

tasks.named("test") {
	failOnNoDiscoveredTests = false
}

check.dependsOn regressionTest



publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
	repositories {
	}
}

